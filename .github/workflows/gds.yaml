---
name: gds

# Official Tiny Tapeout SKY26d actions. The annotated tag TinyTapeout/tt-gds-action@ttsky26d
# dereferences to the commit pinned below; test/check_project.py fails if any TinyTapeout
# action in this file or in docs.yaml is not pinned to it, or still names an older shuttle.
# The gl_test job runs the SAME pin tests as the RTL job: with test/requirements.txt present
# the action installs cocotb==2.0.1 from it, then `make -B GATES=yes`.

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@395eedb3eeec3c2f4961c3b04ff2cf87f5525636 # ttsky26d
        with:
          pdk: sky130A

      # Diagnosis only, NOT a fit proof and NOT part of the physical verdict. It runs even when Build
      # GDS fails (the PDK stays on this runner); a red Build GDS stays red whatever this step does.
      # It uses the host yosys (a different version from the GDS flow, recorded in the artifact) and
      # the real sky130 hd liberty found on the runner. Any incomplete diagnosis (missing liberty,
      # failed profile, a cell of unknown area) makes THIS step exit non-zero and report FAIL with no
      # area numbers, never 0. If Build GDS itself passed and only the diagnosis failed, this job is
      # red on purpose (fail closed). See test/area_profile.py.
      - name: Area profile postmortem (hierarchical diagnosis)
        if: always()
        run: python3 test/area_profile.py --out area-profile --pdk sky130A

      - name: Upload the area profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AREA_PROFILE
          path: area-profile/
          if-no-files-found: error

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@395eedb3eeec3c2f4961c3b04ff2cf87f5525636 # ttsky26d

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@395eedb3eeec3c2f4961c3b04ff2cf87f5525636 # ttsky26d

  # The viewer only PUBLISHES the 3D view to GitHub Pages. It is optional and is NOT a physical
  # check: gds, precheck and gl_test above stay required on every push, on the same SHA. The
  # viewer job runs only on the default branch (main) of whichever repository runs the workflow
  # and is SKIPPED on every other branch (not failed, not masked). On the default branch of a
  # FORK it does run there; whether GitHub Pages is set up in that fork is not verified. A
  # skipped viewer proves nothing about the layout; only gds + precheck + gl_test do.
  viewer:
    needs: gds
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@395eedb3eeec3c2f4961c3b04ff2cf87f5525636 # ttsky26d
