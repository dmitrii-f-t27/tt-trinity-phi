name: RTL & Cocotb Tests

# SKY26d GF16 DOT4 (issue #100). Every job below fails closed: there is no `|| true`, no
# `continue-on-error`, and a green `make` alone is not accepted (test/check_results.py).
# The gate-level run of the SAME pin tests is done by the official gl_test job in gds.yaml.

on:
  push:                 # every branch: a feature-branch or fork push runs ALL jobs below
  pull_request:
  workflow_dispatch:

jobs:
  spec-static:
    name: Spec assertions, oracle self-check, source-list gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute every test and invariant block of the .t27 spec (fail-closed adapter)
        run: python3 test/t27_exec.py

      - name: Oracle self-check, conformance vectors, spec vs oracle vs pin model
        run: python3 test/oracle_selfcheck.py

      - name: Source list == Makefile == instantiated files, pins, official action pin, no '*'
        run: python3 test/check_project.py

  unit-full:
    name: Isolated MUL/ADD vs exact oracle (full sweeps, 0 mismatches)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install IVerilog
        run: sudo apt-get update && sudo apt-get install -y iverilog python3

      - name: Full unit sweeps (also all 2^20 shift-and-add products vs integer product)
        run: python3 test/unit_sweeps.py --profile full --jobs 4

  pin-rtl:
    name: Pin-level cocotb tests (RTL)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cocotb (pinned) and IVerilog
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv iverilog
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r test/requirements.txt

      - name: Run the pin tests
        run: |
          . "$RUNNER_TEMP/venv/bin/activate"
          cd test
          PHI_RANDOM_N=2000 make

      - name: Require every declared test to have run and passed
        run: python3 test/check_results.py test/results.xml test/test.py

  mutations:
    name: Negative controls (mutated RTL must fail the pin tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cocotb (pinned) and IVerilog
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv iverilog
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r test/requirements.txt

      - name: Run the mutation harness
        run: |
          . "$RUNNER_TEMP/venv/bin/activate"
          python3 test/mutation_runner.py

  synth-audit:
    name: Yosys audit of the active sources (no $mul)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Yosys
        run: sudo apt-get update && sudo apt-get install -y yosys python3

      - name: Fail-closed Yosys audit
        run: python3 test/synth_audit.py

  # ---- compatibility jobs kept from the archived baseline (they test archived files) ----
  gf16-fix-verify:
    name: GF16 v2 arithmetic fix verification (archived comparison, faithful check)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install IVerilog
        run: sudo apt-get update && sudo apt-get install -y iverilog python3

      - name: Compare old units and the SKY26d v2 units on the staged pair set
        run: python3 test/gf16_v2_verify.py

  width-defect-gate:
    name: Width/range defect gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator python3

      - name: No new 'field one bit too narrow' defects (value-overflow / out-of-range select)
        run: python3 test/width_gate.py

  gfn-add-sweep:
    name: GoldenFloat gfN adder functional sweep
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install IVerilog
        run: sudo apt-get update && sudo apt-get install -y iverilog python3

      - name: gf8..gf256 adders vs exact-rational reference (<= 1 ULP)
        run: python3 test/gf_add_sweep.py

  instantiated-audit:
    name: Archived Phi blocks conformance audit (not part of the active design)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install IVerilog
        run: sudo apt-get update && sudo apt-get install -y iverilog python3

      - name: Archived blocks (phi_anchor_post, sacred_constants_rom, phi_mesh_bridge, phi_d2d_lite)
        run: python3 test/phi_audit.py
